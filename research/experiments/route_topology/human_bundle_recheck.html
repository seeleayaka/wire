<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接关系复核</title>
<style>
*{box-sizing:border-box}body{margin:24px auto;max-width:1320px;padding:0 20px;background:#f5f6f8;color:#253243;font:15px 'Microsoft YaHei',sans-serif}h1{font-size:24px}h2{font-size:18px}p{line-height:1.6}.muted{color:#657283}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;border:1px solid #dce1e7;border-radius:7px;padding:18px}img,canvas{max-width:100%;width:100%;height:auto}canvas{touch-action:none;cursor:crosshair}select,input,textarea,button{font:inherit;padding:8px;border:1px solid #b9c4cf;border-radius:4px}select,textarea{width:100%}label{display:block;margin:10px 0}button{cursor:pointer;background:#fff}button.primary{background:#1c619e;color:white}.zooms{display:flex;gap:10px}.zooms canvas{width:48%;cursor:default;background:#f0f3f5}#result{white-space:pre-wrap;overflow-wrap:anywhere}#status{color:#a33420}.row{display:flex;gap:10px;align-items:center}.row input{min-width:0;flex:1}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
<h1>连接关系复核</h1><p class="muted">自动证据不足时，在待检原图框出两端，确认身份与对应关系，再记录人工复核。走线形状不参与接法比较。仅判断可见线束关系，不证明电气导通。</p>
<div class="grid"><section class="panel"><h2>正常参考</h2><canvas id="reference"></canvas><p>已确认：风扇出线处 FAN_LEAD → 插座 FAN_CPU。出线处不是可见电气端子。</p><div class="zooms"><canvas id="reflead" width="240" height="180"></canvas><canvas id="refsocket" width="240" height="180"></canvas></div></section>
<section class="panel"><h2>待检原图</h2><select id="case"></select><p id="automatic"></p><select id="kind"><option value="visible_lead_emergence">框选风扇出线处</option><option value="wire_entry_socket">框选插口 / 接点</option></select><p class="muted">在图上拖出矩形；第二个框可重画。下方放大图用于核查，不会自动确认。</p><canvas id="inspection"></canvas><div class="zooms"><canvas id="leadzoom" width="240" height="180"></canvas><canvas id="socketzoom" width="240" height="180"></canvas></div><p id="boxes" class="muted">尚未标注两端</p></section></div>
<section class="panel" style="margin-top:18px"><h2>复核证据</h2><div class="grid"><div>
<label>出线处身份 <input id="leadid" placeholder="例如 FAN_LEAD"></label><label><input id="leadconfirmed" type="checkbox"> 我已核对出线处身份</label>
<label>插口身份 <input id="socketid" placeholder="例如 FAN_CPU；其他插口请填实际身份"></label><label><input id="socketconfirmed" type="checkbox"> 我已核对插口身份</label>
<label>插口可见状态<select id="socketstate"><option value="uncertain">看不清，保留未知</option><option value="attached">可见插接</option><option value="contacts_exposed">参考插座接点露出</option></select></label>
<label><input id="bundleconfirmed" type="checkbox"> 我能确认这两个位置对应同一组线束；不是只凭距离近猜测</label>
<label>走线外观<select id="route"><option value="unknown">未确认</option><option value="different">与参考不同</option><option value="same">与参考相同</option></select></label>
</div><div><label>记录来源<select id="reviewsource"><option value="human_ui_review">人工复核</option><option value="assistant_visual_review">AI 自查（非人类验收）</option><option value="software_fixture">软件测试（非真实验收）</option></select></label><label>复核人 / 工具 <input id="reviewer" autocomplete="off" placeholder="实际操作者姓名或工具名称"></label><label>可见证据 / 不确定之处<textarea id="note" rows="5" placeholder="说明如何确认线束与插口；遮挡无法确认就不要勾选"></textarea></label>
<label><input id="ack" type="checkbox"> 我理解这只是人工可见线束复核，不是电气通断或逐芯检查</label>
<button class="primary" id="save">记录复核并生成报告</button><p id="status" role="status"></p><pre id="result"></pre><button id="download" hidden>下载复核报告 JSON</button></div></div></section>
<script>
'use strict';
let catalog,current,photo,boxes={},ready=false,report=null,saving=false;
const $=id=>document.getElementById(id), names={same_visible_bundle_attachment_supported:'可见线束接法与参考一致',visible_socket_attachment_change_supported:'可见插接状态变化',insufficient_evidence:'证据不足，待复核'},humanNames={human_confirmed_same_visible_attachment:'人工确认：可见线束接法一致（走线路径不影响本结论）',human_confirmed_changed_visible_attachment:'人工确认：可见端点关系与参考不同',human_confirmed_reference_socket_contacts_exposed:'人工确认：参考插座接点露出；未判定电气断路',insufficient_evidence:'人工补证仍不足，保留未知'};
function clearSaved(){const hadReport=report!==null;report=null;$('download').hidden=true;$('result').textContent='';$('status').textContent=hadReport?'内容已变化，请重新核对并保存':'';}
function invalidateIdentity(confirmation){$(confirmation).checked=false;$('bundleconfirmed').checked=false;clearSaved();}
function reset(){boxes={};ready=false;start=null;clearSaved();$('status').textContent='';for(const id of ['leadconfirmed','socketconfirmed','bundleconfirmed','ack'])$(id).checked=false;for(const id of ['leadid','socketid','note'])$(id).value='';$('socketstate').value='uncertain';$('route').value='unknown';for(const id of ['leadzoom','socketzoom']){const c=$(id);c.getContext('2d').clearRect(0,0,c.width,c.height);}}
function zoom(id,img,box){const c=$(id),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const pad=30,x=Math.max(0,box[0]-pad),y=Math.max(0,box[1]-pad),w=Math.min(img.width-x,box[2]-x+pad),h=Math.min(img.height-y,box[3]-y+pad);const scale=Math.min(c.width/w,c.height/h),dx=(c.width-w*scale)/2,dy=(c.height-h*scale)/2;ctx.drawImage(img,x,y,w,h,dx,dy,w*scale,h*scale);ctx.strokeStyle='#cf7317';ctx.lineWidth=2;ctx.strokeRect(dx+(box[0]-x)*scale,dy+(box[1]-y)*scale,(box[2]-box[0])*scale,(box[3]-box[1])*scale);}
function paint(){const c=$('inspection'),ctx=c.getContext('2d');ctx.drawImage(photo,0,0);ctx.lineWidth=7;for(const [kind,b]of Object.entries(boxes)){ctx.strokeStyle=kind==='wire_entry_socket'?'#d17a19':'#2375b5';ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);zoom(kind==='wire_entry_socket'?'socketzoom':'leadzoom',photo,b);}$('boxes').textContent=Object.entries(boxes).map(([k,b])=>(k==='wire_entry_socket'?'插口':'出线处')+'：'+b.join(', ')).join('；')||'尚未标注两端';}
let generation=0;
async function choose(){const g=++generation;reset();current=catalog.cases.find(c=>c.id===$('case').value);$('automatic').textContent='原自动结论：'+(names[current.automatic_comparison.decision]||current.automatic_comparison.decision)+'。历史已核验结果，本次未重新推理。';const im=new Image();im.src=current.image_url;await im.decode();if(g!==generation)return;photo=im;const c=$('inspection');[c.width,c.height]=current.image_binding.image_size;paint();ready=true;}
const canvas=$('inspection');let start=null;
function xy(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(canvas.width,Math.round((e.clientX-r.left)*canvas.width/r.width))),Math.max(0,Math.min(canvas.height,Math.round((e.clientY-r.top)*canvas.height/r.height)))];}
canvas.onpointerdown=e=>{if(!ready||saving)return;start=xy(e);canvas.setPointerCapture(e.pointerId);};
canvas.onpointerup=e=>{if(!start)return;const end=xy(e),b=[Math.min(start[0],end[0]),Math.min(start[1],end[1]),Math.max(start[0],end[0]),Math.max(start[1],end[1])];start=null;if(b[0]===b[2]||b[1]===b[3])return;const k=$('kind').value;boxes[k]=b;$(k==='wire_entry_socket'?'socketconfirmed':'leadconfirmed').checked=false;$('bundleconfirmed').checked=false;report=null;$('download').hidden=true;$('result').textContent='';paint();};
canvas.onpointercancel=()=>start=null;
function submission(){if(!ready)throw Error('图像尚未载入');if(!boxes.visible_lead_emergence||!boxes.wire_entry_socket)throw Error('请先在待检图标注两端');return {case_id:current.id,submission_kind:$('reviewsource').value,image_binding:current.image_binding,reviewer:$('reviewer').value,evidence_note:$('note').value,scope_acknowledged:$('ack').checked,endpoints:[{kind:'visible_lead_emergence',identity:$('leadid').value,bbox_xyxy:boxes.visible_lead_emergence,identity_confirmed:$('leadconfirmed').checked},{kind:'wire_entry_socket',identity:$('socketid').value,bbox_xyxy:boxes.wire_entry_socket,identity_confirmed:$('socketconfirmed').checked}],same_bundle_confirmed:$('bundleconfirmed').checked,socket_state:$('socketstate').value,route_change:$('route').value};}
$('leadid').oninput=()=>invalidateIdentity('leadconfirmed');$('socketid').oninput=()=>invalidateIdentity('socketconfirmed');
$('socketstate').onchange=()=>{$('bundleconfirmed').checked=false;clearSaved();};
$('reviewsource').onchange=()=>{for(const id of ['leadconfirmed','socketconfirmed','bundleconfirmed','ack'])$(id).checked=false;clearSaved();};
for(const id of ['reviewer','note'])$(id).oninput=clearSaved;
for(const id of ['leadconfirmed','socketconfirmed','bundleconfirmed','ack','route'])$(id).onchange=clearSaved;
function lockForm(locked){saving=locked;for(const el of document.querySelectorAll('input,select,textarea,button'))el.disabled=locked;}
$('save').onclick=async()=>{if(saving)return;try{const payload=submission();clearSaved();lockForm(true);const response=await fetch('/recheck',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':catalog.csrf_token},body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw Error(data.error);report=data.report;$('result').textContent=report.review_result_label+'\n\n原自动结论保持不变；自动新增命中 0。\n已保存：'+data.saved_report;$('status').textContent=report.review_source_label+'记录已保存';$('download').hidden=false;}catch(e){$('status').textContent=e.message;}finally{lockForm(false);}};
$('download').onclick=()=>{if(!report)return;const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=current.id+'_recheck.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
(async()=>{const response=await fetch('/catalog');if(!response.ok)throw Error('无法读取核验后的病例');catalog=await response.json();for(const c of catalog.cases){const o=document.createElement('option');o.value=c.id;o.textContent=c.id+' · '+names[c.automatic_comparison.decision];$('case').append(o);}const image=new Image();image.src='/image/reference';await image.decode();const c=$('reference');c.width=image.width;c.height=image.height;const ctx=c.getContext('2d');ctx.drawImage(image,0,0);ctx.strokeStyle='#2375b5';ctx.lineWidth=7;for(const a of catalog.scope.anchors){const b=a.bbox_xyxy;ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);zoom(a.kind==='wire_entry_socket'?'refsocket':'reflead',image,b);}$('case').onchange=()=>choose().catch(e=>$('status').textContent=e.message);await choose();})().catch(e=>$('status').textContent=e.message);
</script></html>
